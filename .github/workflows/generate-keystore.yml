name: Generera signeringsnyckel (engångskörning)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generera ny keystore
        run: |
          # PKCS12-keystore använder samma lösenord för store och key, så vi
          # genererar bara ett (alfanumeriskt så det inte kan kopieras fel).
          PASS=$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)
          KEYSTORE_PASS="$PASS"
          KEY_PASS="$PASS"
          KEY_ALIAS=vagnkoll

          keytool -genkeypair \
            -keystore vagnkoll-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Vagnkoll, OU=Personal, O=sm5tog, L=., S=., C=SE"

          # Verifiera att keystoren öppnas med lösenordet
          keytool -list -keystore vagnkoll-release.jks \
            -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" > /dev/null
          echo "Verifierat: keystore fungerar"

          # Base64-koda keystoren
          base64 -w 0 vagnkoll-release.jks > vagnkoll-release.jks.base64

          # Skapa instruktioner — varje värde mellan <<< och >>> så det är omöjligt att kopiera fel
          cat > GITHUB-SECRETS-ATT-LÄGGA-TILL.txt <<EOF
          === HUR DU GÖR ===

          Gå till: https://github.com/sm5tog/vagnkoll/settings/secrets/actions

          För varje secret nedan: tryck antingen "New repository secret" (om den
          inte finns) eller klicka på den existerande secreten och tryck "Update".

          Kopiera EXAKT det som står mellan <<< och >>> — varken mer eller mindre.
          Inga radbrytningar, inga mellanslag före eller efter.

          ---

          Secret #1: KEYSTORE_BASE64
          (HELA innehållet av filen vagnkoll-release.jks.base64 — markera
           allt med Ctrl+A i Anteckningar och kopiera)

          ---

          Secret #2: KEYSTORE_PASSWORD
          <<<${KEYSTORE_PASS}>>>

          ---

          Secret #3: KEY_ALIAS
          <<<${KEY_ALIAS}>>>

          ---

          Secret #4: KEY_PASSWORD
          <<<${KEY_PASS}>>>

          ---

          När alla fyra är uppdaterade, gå till körningens artefakt och
          klicka på soptunne-ikonen för att radera den. Då finns inget
          spår av lösenorden kvar publikt.
          EOF

          ls -la

      - name: Ladda upp keystore + instruktioner
        uses: actions/upload-artifact@v4
        with:
          name: VIKTIGT-ladda-ner-och-läs
          path: |
            vagnkoll-release.jks.base64
            GITHUB-SECRETS-ATT-LÄGGA-TILL.txt
          retention-days: 1
